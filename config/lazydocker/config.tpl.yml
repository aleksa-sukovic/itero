gui:
    returnImmediately: true
    theme:
        activeBorderColor:
            - "{{ accent }}"
            - bold
        inactiveBorderColor:
            - "{{ muted }}"
        optionsTextColor:
            - "{{ accent }}"
        selectedLineBgColor:
            - "{{ selection }}"
stats:
    graphs:
        - caption: CPU (%)
          statPath: DerivedStats.CPUPercentage
          color: "{{ accent }}"
        - caption: Memory (%)
          statPath: DerivedStats.MemoryPercentage
          color: "{{ green }}"
