[org/gnome/desktop/interface]
clock-show-weekday=true
scaling-factor=uint32 1
show-battery-percentage=true
enable-hot-corners=false

[org/gnome/software]
download-updates=false

[org/gnome/desktop/wm/keybindings]
activate-window-menu=@as []
close=['<Super>q']
maximize=@as []
minimize=@as []
unmaximize=@as []
begin-move=@as []
begin-resize=@as []

move-to-monitor-down=@as []
move-to-monitor-left=@as []
move-to-monitor-right=@as []
move-to-monitor-up=@as []

move-to-workspace-1=['<Shift><Super>1']
move-to-workspace-2=['<Shift><Super>2']
move-to-workspace-3=['<Shift><Super>3']
move-to-workspace-4=['<Shift><Super>4']

switch-to-workspace-1=['<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
move-to-workspace-left=@as []

switch-group=['<Super>grave']
switch-group-backward=['<Super><Shift>grave']
cycle-group=@as []
cycle-group-backward=@as []

switch-input-source=['<Alt>space']
switch-input-source-backward=['<Shift><Alt>space']

[org/gnome/desktop/wm/preferences]
button-layout='close,minimize,maximize:appmenu'
resize-with-right-button=true

[org/gnome/desktop/peripherals/mouse]
accel-profile='flat'
natural-scroll=true
speed=0.25102880658436222

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'de'), ('xkb', 'me')]

[org/gnome/desktop/calendar]
show-weekdate=true

[org/gnome/desktop/screensaver]
lock-delay=uint32 300
lock-enabled=true

[org/gnome/desktop/session]
idle-delay=uint32 900

[org/gnome/desktop/notifications]
show-banners=false

[org/gnome/mutter]
dynamic-workspaces=false
edge-tiling=false
overlay-key=''

[org/gnome/mutter/keybindings]
switch-monitor=@as []
toggle-tiled-left=@as []
toggle-tiled-right=@as []

[org/gnome/login-screen]
logo=''

[org/gnome/shell]
disabled-extensions=['background-logo@fedorahosted.org', 'apps-menu@gnome-shell-extensions.gcampax.github.com', 'launch-new-instance@gnome-shell-extensions.gcampax.github.com', 'places-menu@gnome-shell-extensions.gcampax.github.com', 'window-list@gnome-shell-extensions.gcampax.github.com']
enabled-extensions=['auto-accent-colour@Wartybix', 'gsconnect@andyholmes.github.io', 'night-light-slider-updated@vilsbeg.codeberg.org', 'itero-wm@itero', 'vicinae@dagimg-dot']
favorite-apps=['org.gnome.Nautilus.desktop', 'org.mozilla.firefox.desktop', 'org.chromium.Chromium.desktop', 'md.obsidian.Obsidian.desktop', 'org.zotero.Zotero.desktop', 'com.calibre_ebook.calibre.desktop', 'org.gnome.Papers.desktop', 'syncthing-ui.desktop', 'libreoffice-writer.desktop', 'libreoffice-calc.desktop', 'libreoffice-impress.desktop', 'org.wezfurlong.wezterm.desktop', 'org.gnome.Settings.desktop']

[org/gnome/shell/extensions/gsconnect]
name='{{ $HOST }}'

[org/gnome/shell/extensions/nightlightsliderupdated]
swap-axis=true

[org/gnome/shell/extensions/itero-wm]
active-hint=true
corner-radius=uint32 8
hint-color-rgba='rgba({{ accent_rgb }}, 1)'
inactive-tab-color-rgba='rgba({{ accent_dark_rgb }}, 1)'
active-tab-foreground-rgba='{{ background }}'
inactive-tab-foreground-rgba='{{ background }}'

tile-enter=['<Super>r', '<Super>KP_Enter']
toggle-stacking=@as []
cycle-window-mode-global=['<Shift><Super>g']
toggle-stacking-global=['<Shift><Super>s']
unstack-active-global=['<Shift><Super><Alt>s']
stack-active-global=['<Shift><Super><Primary>s']
move-tab-left-global=['<Shift><Super><Alt>h']
move-tab-right-global=['<Shift><Super><Alt>l']
activate-launcher=@as []
toggle-top-bar=['<Shift><Super>m']
refresh-tiling=['<Shift><Super>r']

default-window-mode='float'
float-default-width-percentage=uint32 60
float-default-height-percentage=uint32 90
gap-inner=uint32 4
gap-outer=uint32 4
snap-to-grid=true

[org/gnome/shell/extensions/vicinae]
show-status-indicator=false

[org/gnome/shell/extensions/auto-accent-colour]
highlight-mode=true

[org/gnome/shell/keybindings]
open-new-window-application-3=@as []
open-new-window-application-4=@as []
screenshot=@as []
show-screenshot-ui=@as []
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
switch-to-application-5=@as []
switch-to-application-6=@as []
switch-to-application-7=@as []
switch-to-application-8=@as []
switch-to-application-9=@as []
toggle-message-tray=['<Super>m']
focus-active-notification=@as []
toggle-overview=['<Super>s']
toggle-quick-settings=['<Super>slash']

[org/gnome/shell/weather]
automatic-location=true
locations=[<(uint32 2, <('Munich', 'EDMO', false, [(0.83921247618284267, 0.19693131144892936)], [(0.83921247618284267, 0.19693131144892936)])>)>, <(uint32 2, <('Podgorica', 'LYPG', true, [(0.74060137344516286, 0.33655765160847567)], [(0.74073712515438317, 0.33621343777339741)])>)>]

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom4/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom5/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom6/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom7/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom8/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom9/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom10/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom11/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom12/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom13/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom14/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom15/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom16/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom17/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom18/']
email=@as []
help=@as []
home=@as []
screensaver=['<Primary><Super>slash']
www=@as []

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super>Return'
command='wezterm'
name='WezTerm'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Super><Shift>Return'
command='wezterm start -- zsh -ic "t"'
name='Tmux'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3]
binding='<Super><Shift><Alt>e'
command='wezterm start -- /home/{{ $USER }}/.local/bin/yazi'
name='Yazi'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom4]
binding='<Super><Shift>t'
command='wezterm start -- btop'
name='Btop'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom5]
binding='<Super>n'
command='wezterm start nvim /home/{{ $USER }}/.vimscratch.md'
name='Scratch Pad'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom6]
binding='<Super><Shift>n'
command='flatpak run md.obsidian.Obsidian'
name='Obsidian'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom7]
binding='{{ $BRIGHTNESS_KEY_UP }}'
command='/home/{{ $USER }}/.local/share/itero/bin/itero-monitor brightness --up'
name='External Display Brightness Up'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom8]
binding='{{ $BRIGHTNESS_KEY_DOWN }}'
command='/home/{{ $USER }}/.local/share/itero/bin/itero-monitor brightness --down'
name='External Display Brightness Down'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom9]
binding='<Super>space'
command='vicinae toggle'
name='Vicinae'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom10]
binding='<Control><Super>e'
command='vicinae deeplink vicinae://launch/core/search-emojis'
name='Vicinae Emoji Picker'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom11]
binding='<Control><Super>v'
command='vicinae deeplink vicinae://launch/clipboard/history'
name='Vicinae Clipboard'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom12]
binding='<Control><Super><Alt>v'
command='vicinae deeplink vicinae://launch/clipboard/clear'
name='Vicinae Clipboard Clear'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom13]
binding='<Super>e'
command='/home/{{ $USER }}/.local/share/itero/bin/itero-nautilus'
name='Nautilus'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom14]
binding='<Super><Shift>e'
command='/home/{{ $USER }}/.local/share/itero/bin/itero-nautilus --cwd'
name='Nautilus in Terminal Cwd'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom15]
binding='<Super><Shift>slash'
command='/home/{{ $USER }}/.local/share/itero/bin/itero-cycle-wallpaper'
name='Cycle Wallpaper'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom16]
binding='<Control><Super>c'
command='/home/{{ $USER }}/.local/share/itero/bin/itero-screenshot'
name='Capture Ccreenshot'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom17]
binding='<Super>b'
command='firefox'
name='Browser'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom18]
binding='<Super><Shift>b'
command='firefox --private-window'
name='Browser (Private)'

[org/gnome/settings-daemon/plugins/power]
power-button-action='interactive'
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-timeout=1800

[org/gnome/nautilus/preferences]
click-policy='single'
default-folder-viewer='list-view'

[org/gnome/nautilus/list-view]
use-tree-view=true
