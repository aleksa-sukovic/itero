[mgr]
prepend_keymap = [
    { on = "l", run = "plugin smart-enter", desc = "Enter directory or open file" },
    { on = "f", run = "plugin smart-filter", desc = "Filter files" },
    { on = "p", run = "plugin smart-paste", desc = "Paste into the hovered directory or CWD" },
    { on = "T", run = "plugin toggle-pane max-preview", desc = "Maximize or restore preview" },
    { on = [ "g", "v" ], run = "plugin vcs-files", desc = "Show Git file changes" },
    { on = [ "g", "l" ], run = 'shell "lazygit" --block', desc = "Open Lazygit" },
    { on = [ "g", "r" ], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Go to Git root" },
    { on = "M", run = "plugin mount", desc = "Mount manager" },
]
