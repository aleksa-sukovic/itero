onboarding = false

[theme]
name = "terminal"

[theme.custom]
accent = "{{ accent }}"
panel_bg = "{{ background }}"
sidebar_bg = "{{ dark_background }}"
active_row_bg = "{{ lighter_background }}"
selection_bg = "{{ selection }}"
surface0 = "{{ lighter_background }}"
surface1 = "{{ selection }}"
surface_dim = "{{ dark_background }}"
overlay0 = "{{ muted }}"
overlay1 = "{{ dark_foreground }}"
text = "{{ foreground }}"
subtext0 = "{{ light_foreground }}"
mauve = "{{ mauve }}"
green = "{{ green }}"
yellow = "{{ yellow }}"
red = "{{ red }}"
blue = "{{ blue }}"
teal = "{{ teal }}"
peach = "{{ peach }}"

[keys]
prefix = "ctrl+b"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"
split_vertical = ["prefix+v", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]

[ui]
mobile_width_threshold = 64
hide_tab_bar_when_single_tab = true
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "machine", "workspace"], ["agent", "terminal_title_stripped"]]

[ui.toast]
delivery = "herdr"
