promptToReturnFromSubprocess: false
os:
    editPreset: "nvim"
git:
    pagers:
        - colorArg: "always"
          pager: "delta --{{ mode }} --paging=never"
gui:
    theme:
        activeBorderColor:
            - "{{ accent }}"
            - bold
        inactiveBorderColor:
            - "{{ muted }}"
        optionsTextColor:
            - "{{ accent }}"
        selectedLineBgColor:
            - "{{ selection }}"
        cherryPickedCommitBgColor:
            - "{{ muted }}"
        cherryPickedCommitFgColor:
            - "{{ accent }}"
        unstagedChangesColor:
            - "{{ red }}"
        defaultFgColor:
            - "{{ foreground }}"
        searchingActiveBorderColor:
            - "{{ yellow }}"
    authorColors:
        "*": "{{ magenta }}"
